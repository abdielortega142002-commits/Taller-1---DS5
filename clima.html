<body>
  <header>

  <h2>Calcular el Estado del Clima</h2>
  <h3>Rellena los Campos Correctamente para Determinar el Estado del Clima</h3>
  <div class="contenedor">
    <div>
      <label for="temp">Ingresa la Temperatura (°C)</label>
      <input type="number" id="temp" name="temp" step="any" inputmode="decimal" placeholder="Ej. 23.5">
    </div>
    <br>
    <br>
    <div>
      <label for="hum">Ingresa la Humedad Relativa (%)</label>
      <input type="number" id="hum" name="hum" step="any" inputmode="decimal" min="0" max="100" placeholder="0 - 100">
    </div>
    <br>
    <br>
    <div>
      <button id="checkBtn" type="button">Determinar Clima</button>
    </div>
  </div>
  <div id="result" aria-live="polite"></div>
</body>

</html>
