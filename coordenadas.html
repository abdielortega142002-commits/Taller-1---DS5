  <h2>Calcular la Pendiente de 2 Puntos en el Plano Cartesiano</h2>
  <h3>Rellena los Campos con la Información Correcta para poder saber la Pendiente</h3>
  <div class="coordenadas-contenedor">
    <div>
      <label for="x1">Ingresa x1</label>
      <input type="number" id="x1" step="any" inputmode="decimal" />
    </div>
  
    <div>
      <label for="y1">Ingresa y1</label>
      <input type="number" id="y1" step="any" inputmode="decimal" />
    </div>

      <label for="x2">Ingresa x2</label>
      <input type="number" id="x2" step="any" inputmode="decimal" />
    </div>
  
    <div>
      <label for="y2">Ingresa y2</label>
      <input type="number" id="y2" step="any" inputmode="decimal" />
    </div>
  </div>
  <br>
  <br>
  <div id="boton">
    <button id="calcBtn" type="button">Calcular Pendiente</button>
  </div>
  <div id="result" aria-live="polite"></div>
